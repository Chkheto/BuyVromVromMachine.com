<div class="container">
  <div class="upload-card shadow-sm">
    <h2>Upload New Vehicle</h2>

    <!-- Feedback Alerts -->
    <div *ngIf="successMessage" class="alert alert-success mb-3 py-2 small">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger mb-3 py-2 small">{{ errorMessage }}</div>

    <form [formGroup]="carForm" (ngSubmit)="onSubmit()" class="upload-form">
      
      <div class="form-group">
        <label>Brand</label>
        <input type="text" class="form-control" formControlName="brand" placeholder="e.g. Audi">
      </div>

      <div class="form-group">
        <label>Model</label>
        <input type="text" class="form-control" formControlName="model" placeholder="e.g. 80 B3">
      </div>

      <div class="form-group">
        <label>Year</label>
        <input type="number" class="form-control" formControlName="year" placeholder="e.g. 1991">
      </div>

      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" class="form-control" formControlName="price" placeholder="Enter price">
      </div>

      <div class="form-group">
        <label>Mileage (km)</label>
        <input type="number" class="form-control" formControlName="mileage" placeholder="Enter mileage">
      </div>

      <div class="form-group">
        <label>Fuel Type</label>
        <select class="form-control" formControlName="fuelType">
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="Electric">Electric</option>
          <option value="Hybrid">Hybrid</option>
        </select>
      </div>

      <div class="form-group">
        <label>Transmission</label>
        <select class="form-control" formControlName="transmission">
          <option value="Automatic">Automatic</option>
          <option value="Manual">Manual</option>
        </select>
      </div>

      <div class="form-group">
        <label>Color</label>
        <input type="text" class="form-control" formControlName="color" placeholder="e.g. Black">
      </div>

      <!-- Device File Picker -->
      <div class="form-group">
        <label>Vehicle Image File</label>
        <input type="file" class="form-control file-input" accept="image/*" (change)="onFileSelected($event)">
      </div>

      <!-- Live Preview Container -->
      <div *ngIf="imagePreview" class="image-preview-container mt-2">
        <img [src]="imagePreview" alt="Car Preview">
      </div>

      <div class="form-group">
        <label>Seller Password (for verification)</label>
        <input type="password" class="form-control" formControlName="sellerPassword" placeholder="Enter your password">
      </div>

      <button type="submit" class="upload-btn mt-3" [disabled]="isLoading">
        {{ isLoading ? 'Publishing...' : 'Publish Listing' }}
      </button>
    </form>
  </div>
</div>
