<div class="container">
  <div class="car-detail-card" *ngIf="selectedCar; else notFound">
    <h1>{{ selectedCar.name }}</h1>
    
    <div class="car-image-container">
      <img [src]="selectedCar.image || selectedCar.imageUrl" [alt]="selectedCar.name">
    </div>

    <div class="car-info">
      <div class="info-group">
        <label>Price</label>
        <p class="price">${{ selectedCar.price }}</p>
      </div>

      <div class="info-group">
        <label>Description & Specs</label>
        <p>{{ selectedCar.description }}</p>
      </div>
    </div>

    <button class="back-btn" routerLink="/menu">Back to Inventory</button>
  </div>

  <ng-template #notFound>
    <div class="car-detail-card">
      <h1>Vehicle Not Found</h1>
      <p>The requested car GUID ({{ carId }}) does not exist or has been removed.</p>
      <button class="back-btn" routerLink="/menu">Return to Inventory</button>
    </div>
  </ng-template>
</div>
