<div class="container">
  <h1>Cart</h1>

  <div *ngIf="basket.length === 0">Cart is empty</div>

  <div *ngFor="let item of basket" class="cart-item">
    <div>
      <p><strong>{{ item.product?.name || ('Product #' + item.productId) }}</strong></p>
      <p>Quantity: {{ item.quantity }}</p>
      <p>Price: ${{ item.price }}</p>
    </div>

    <button (click)="removeFromCart(item.id)">Remove</button>
  </div>
</div>
